name: OSV-Scanner

# PR では差分スキャン、main への push と週次では全体スキャン。
# 結果は GitHub の Security タブ (code scanning) に上がる。
permissions: {}

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 23 * * 3" # 水曜 23:17 UTC

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write
