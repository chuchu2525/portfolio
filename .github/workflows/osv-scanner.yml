name: OSV-Scanner

# PRは差分、merge queue・mainへのpush・日次は全体スキャン。
# 再利用PRスキャンはGITHUB_BASE_REFを使うためmerge_groupには使わない。
# report は可視化専用。脆弱性の合否判定は既存の scan-pr / scan-scheduled が担う。
permissions: {}

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 23 * * *" # 毎日 08:17 JST

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'merge_group' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write

  report:
    name: OSV vulnerability report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject a report supplied by the repository
        run: test ! -e osv-report.json && test ! -L osv-report.json
      - name: Scan dependencies and generate JSON
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-report.json
            -r
            ./
      - name: Write scan summary
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/security/osv_summary.py osv-report.json "$GITHUB_STEP_SUMMARY" --outcome "$SCAN_OUTCOME"
      - name: Upload JSON report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-report
          path: osv-report.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: OSV gate
    if: ${{ always() }}
    needs: [scan-pr, scan-scheduled, report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the scanner for this event and a valid report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          event = os.environ["EVENT_NAME"]
          if event == "pull_request":
              scanner = "scan-pr"
          elif event in ("push", "schedule", "merge_group"):
              scanner = "scan-scheduled"
          else:
              sys.exit("Unexpected event: " + event)
          required = (scanner, "report")
          failed = [name for name in required if needs.get(name, {}).get("result") != "success"]
          if failed:
              sys.exit("Required jobs did not succeed: " + ", ".join(failed))
          print("All required jobs succeeded")
          PYTHON
