<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yuukun Portfolio Prototypes</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111111;
        --panel: #202020;
        --line: #454652;
        --text: #e8e4df;
        --muted: #b9b5c5;
        --yellow: #ffd245;
        --denim: #1a237e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--text);
        background:
          repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 6px),
          var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(920px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(40px, 7vw, 76px);
        line-height: 0.96;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.7;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      a {
        display: grid;
        min-height: 190px;
        align-content: end;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        color: inherit;
        text-decoration: none;
        background:
          linear-gradient(135deg, rgba(255, 210, 69, 0.12), transparent),
          var(--panel);
      }

      a strong {
        color: var(--yellow);
        font-size: 24px;
      }

      a span {
        display: block;
        margin-top: 10px;
        color: var(--muted);
        line-height: 1.5;
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portfolio Prototypes</h1>
      <p>古着とレコードをモチーフにしたエンジニアポートフォリオのモック置き場です。要件化の中心は v2 です。</p>
      <div class="grid">
        <a href="prototypes/v1/index.html">
          <strong>v1</strong>
          <span>最初のモック。生成背景とジャケット型スキルUI。</span>
        </a>
        <a href="prototypes/v2/index.html">
          <strong>v2</strong>
          <span>CRAFTSMAN.DEV 方向。デニム、レコード、Field Notes、Project Crate。</span>
        </a>
      </div>
    </main>
  </body>
</html>
